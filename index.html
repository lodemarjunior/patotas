<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f9fc"><title>Patotas — Membros</title><meta name="description" content="Controle mensal de membros, mensalidades e multas."><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Patotas"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icons/icon-180.png"><link rel="stylesheet" href="./styles.css?v=20"></head><body><div class="app"><header class="top"><div><div class="brand">Patotas</div><div class="subtitle">Controle mensal dos membros</div></div><div class="header-actions"><button class="icon-btn" id="themeToggle" aria-label="Alternar tema">☾</button></div></header><main><section class="month-bar"><button id="prevMonth" aria-label="Mês anterior">‹</button><button id="selectMonth" class="month-title"></button><button id="nextMonth" aria-label="Próximo mês">›</button></section><div id="view"></div></main></div><div id="modalRoot"></div><div id="toast" role="status"></div><script>
(function(){
var errorText='';
function show(msg){
 var v=document.getElementById('view'),m=document.getElementById('selectMonth');
 if(!v||!m||m.textContent.trim())return;
 v.innerHTML='<div class="panel" style="padding:16px;line-height:1.5"><strong>Não foi possível iniciar o Patotas.</strong><p id="startupError" style="overflow-wrap:anywhere"></p><button id="repairApp" class="action" type="button">Recarregar aplicativo sem apagar dados</button><p class="notice">Os membros e pagamentos armazenados neste aparelho não serão apagados.</p></div>';
 document.getElementById('startupError').textContent=msg||'O arquivo JavaScript não foi carregado.';
 document.getElementById('repairApp').onclick=async function(){
   this.disabled=true;this.textContent='Atualizando arquivos...';
   try{if(navigator.serviceWorker){var all=await navigator.serviceWorker.getRegistrations();await Promise.all(all.filter(x=>x.scope.indexOf('/patotas/')!==-1).map(x=>x.unregister()));}
   if(window.caches){var keys=await caches.keys();await Promise.all(keys.filter(k=>k.indexOf('patotas-pwa-')===0).map(k=>caches.delete(k)));}}
   catch(e){console.warn(e)}
   location.replace('./?refresh='+Date.now());
 };
}
window.addEventListener('error',function(e){errorText=e.message||'Falha de carregamento';show(errorText)});
window.addEventListener('unhandledrejection',function(e){errorText=String(e.reason||'Falha assíncrona');show(errorText)});
window.addEventListener('load',function(){setTimeout(function(){show(errorText||'O JavaScript não terminou a inicialização.');},1500)});
})();
</script><script src="./app.js?v=18" defer onerror="window.dispatchEvent(new ErrorEvent('error',{message:'Falha ao carregar app.js'}))"></script><script>if('serviceWorker' in navigator&&location.protocol==='https:')window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(console.warn))</script></body></html>
